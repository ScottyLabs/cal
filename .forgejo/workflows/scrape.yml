# Data refresh for CMUCal.
#
# These ran as Railway cron jobs before the kennel migration. Kennel deploys
# long-running services, not scheduled jobs, so they live here instead -
# matching ScottyLabs/courses, which runs its scraper the same way.
#
# Manual dispatch only, deliberately. These write directly to the production
# database and the Schedule of Classes scrape takes roughly an hour. The SOC
# semester defaults to the one in session (Jan-May Spring, Aug-Dec Fall) and
# the run refuses to write if the SOC page is for a different term. Add a
# `schedule:` trigger once a run has been watched end to end under kennel.
name: Scrape

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to scrape"
        required: true
        type: choice
        options:
          - soc
          - peer_tutoring
          - supplemental_instruction
          - tartanconnect
          - all
        default: soc
      profile:
        description: "Secret profile to resolve (which database gets written)"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      semester:
        description: "SOC semester label, e.g. Fall_26. Empty = the one in session"
        required: false
        type: string
        default: ""
      dry_run:
        description: "SOC and TartanConnect only: fetch and parse, write nothing"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    name: Scrape and export
    runs-on: native
    enable-openid-connect: true
    env:
      # Kennel overrides the provider at deploy time, but here we resolve
      # explicitly: the CI job authenticates to OpenBao with its own OIDC token.
      SECRETSPEC_PROFILE: ${{ inputs.profile }}
      SECRETSPEC_PROVIDER: openbao-ci
      # Read by scraper/scripts/export_soc.py.
      SOC_SEMESTER: ${{ inputs.semester }}
      SOC_DRY_RUN: ${{ inputs.dry_run }}
      # Read by scraper/scripts/export_tartanconnect.py.
      TARTANCONNECT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - uses: https://git.cmu.dev/ScottyLabs/kennel/.forgejo/actions/prepare@main

      - name: Scrape
        working-directory: api
        run: |
          set -euo pipefail
          run_one() {
            echo "::group::$1"
            devenv shell -- python -m "scraper.scripts.$1"
            echo "::endgroup::"
          }
          case "${{ inputs.source }}" in
            soc)                      run_one export_soc ;;
            peer_tutoring)            run_one export_peer_tutoring ;;
            supplemental_instruction) run_one export_supplemental_instruction ;;
            tartanconnect)            run_one export_tartanconnect ;;
            all)
              run_one export_soc
              run_one export_peer_tutoring
              run_one export_supplemental_instruction
              run_one export_tartanconnect
              ;;
          esac
