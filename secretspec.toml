[project]
name = "cal"
revision = "1.0"

[providers]
local = "dotenv://.env"
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

# ---------------------------------------------------------------------------
# Shared across every profile. Named profiles inherit these and may override.
# ---------------------------------------------------------------------------
[profiles.default]

# Flask picks its config class off APP_ENV. It used to fall back to detecting
# Railway; with Railway gone this has to be set explicitly per profile.
APP_ENV = { description = "Flask config selector: production | test | development" }

SECRET_KEY = { description = "Flask session signing key" }
JWT_SECRET_KEY = { description = "JWT signing key" }

# Google Calendar OAuth (unchanged from the Vercel/Railway setup).
GOOGLE_CLIENT_ID = { description = "Google OAuth client ID" }
GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret" }
GOOGLE_REDIRECT_URI = { description = "Google OAuth callback, points at the API" }
FRONTEND_REDIRECT_URI = { description = "Where the API sends the browser after OAuth" }

# Supabase stays the database for the first cutover. Replace with kennel's
# injected DATABASE_URL once the data moves.
SUPABASE_URL = { description = "Supabase project URL" }
SUPABASE_API_KEY = { description = "Supabase anon/public API key" }
SUPABASE_DB_URL = { description = "Supabase Postgres connection string" }

# Read by app/__init__.py; comma-separated.
CORS_ALLOWED_ORIGINS = { description = "Comma-separated CORS origin allowlist" }

# The API's own public base URL, read by app/env.py:get_api_base_url.
API_BASE_URL = { description = "Public base URL of the API service" }

# Clerk validates sessions server-side in the Next.js middleware.
CLERK_SECRET_KEY = { description = "Clerk backend API secret key" }

# ---------------------------------------------------------------------------
# Optional — only the scraper and course agent need these. Left non-required so
# a web/api deployment does not fail when they are absent.
# ---------------------------------------------------------------------------
OPENAI_API_KEY = { description = "OpenAI key for the course agent", required = false }
SERPER_API_KEY = { description = "Serper search key for the course agent", required = false }
SUPABASE_SERVICE_ROLE_KEY = { description = "Supabase service role key, scraper only", required = false }
HANDSHAKE_AUTH_TOKEN = { description = "Handshake API token", required = false }
MONGO_URI = { description = "Legacy Mongo connection string", required = false }

# ---------------------------------------------------------------------------
# Deployed profiles. Kennel selects by branch: main -> prod, staging -> staging,
# dev -> dev, pull requests -> preview.
# ---------------------------------------------------------------------------
[profiles.prod]

[profiles.staging]

[profiles.preview]

[profiles.dev.defaults]
providers = ["openbao"]

[profiles.dev]
APP_ENV = { description = "Flask config selector", providers = ["local"] }

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
