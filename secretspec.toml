[project]
name = "cal"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"
openbao-ci = "openbao://secrets.scottylabs.org/secret?auth=jwt&role=ci&audience=openbao"

[defaults]
providers = ["openbao"]

[profiles.default]

APP_ENV = { description = "Flask config selector: production | test | development" }

SECRET_KEY = { description = "Flask session signing key" }
JWT_SECRET_KEY = { description = "JWT signing key" }

GOOGLE_CLIENT_ID = { description = "Google OAuth client ID" }
GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret" }
GOOGLE_REDIRECT_URI = { description = "Google OAuth callback, points at the API" }
FRONTEND_REDIRECT_URI = { description = "Where the API sends the browser after OAuth" }

SUPABASE_DB_URL = { description = "Supabase Postgres connection string" }

# Read by app/__init__.py; comma-separated.
CORS_ALLOWED_ORIGINS = { description = "Comma-separated CORS origin allowlist" }

# The API's own public base URL, read by app/env.py:get_api_base_url.
API_BASE_URL = { description = "Public base URL of the API service" }

# Clients `cal`, `cal-staging` and `cal-dev`
OIDC_CLIENT_ID = { description = "Keycloak OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret" }
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm" }
OAUTH_RELAY_URL = { description = "OAuth relay (Ricochet) callback URL" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path; members are CMU Cal site admins" }
SESSION_SECRET = { description = "Encrypts the web session cookies; 32+ random characters" }

# ---------------------------------------------------------------------------
# Optional - only the scraper and course agent need these. Left non-required so a web/api deployment does not fail when they are absent.
# ---------------------------------------------------------------------------
OPENAI_API_KEY = { description = "OpenAI key for the course agent", required = false }
SERPER_API_KEY = { description = "Serper search key for the course agent", required = false }
SUPABASE_URL = { description = "Supabase project URL, scraper and course agent only", required = false }
SUPABASE_API_KEY = { description = "Supabase anon key, scraper and course agent only", required = false }
SUPABASE_SERVICE_ROLE_KEY = { description = "Supabase service role key, scraper only", required = false }
HANDSHAKE_AUTH_TOKEN = { description = "Handshake API token", required = false }
# Bearer token the SOC scraper sends to regenerate_occurrences_by_events.
SCRAPER_API_TOKEN = { description = "Scraper-to-API service token, 32+ characters", required = false }
MONGO_URI = { description = "Legacy Mongo connection string", required = false }

[profiles.prod]
SENTRY_DSN = { description = "Sentry project DSN", required = false }
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = false }
PUBLIC_POSTHOG_HOST = { description = "PostHog instance host", required = false }

[profiles.staging]

[profiles.preview]

[profiles.dev]

[profiles.ci.defaults]
required = false
providers = ["openbao-ci"]

[profiles.ci]
